<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Western Avenue — Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--ink:#201410;--bone:#f3ead9;--dim:#b8aa95;--rust:#9a3b22;--gold:#c9a135;--line:rgba(243,234,217,.14)}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--bone);font:14px Arial,sans-serif}header{position:sticky;top:0;background:#160d0aee;border-bottom:1px solid var(--line);padding:18px 5vw;display:flex;justify-content:space-between;align-items:center;z-index:2}.brand{font-size:24px;font-weight:800;letter-spacing:.06em}.brand span{color:var(--gold);font-style:italic}.wrap{max-width:1200px;margin:auto;padding:45px 5vw 80px}.kicker{color:var(--gold);font-size:11px;letter-spacing:.18em;text-transform:uppercase}.title{font-size:clamp(42px,7vw,76px);margin:10px 0 28px;text-transform:uppercase}.card{background:#281914;border:1px solid var(--line);padding:22px;margin-bottom:20px}.login{max-width:480px;margin:auto}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}input,select{width:100%;padding:12px;background:#120b08;border:1px solid var(--line);color:var(--bone)}button{border:1px solid var(--gold);background:var(--rust);color:var(--bone);padding:12px 16px;cursor:pointer;letter-spacing:.06em}button.secondary{background:none;border-color:var(--line)}.bar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{border:1px solid var(--line);padding:18px}.stat strong{display:block;font-size:30px;color:var(--gold)}.orders{display:grid;gap:12px}.order{border:1px solid var(--line);padding:18px}.order-head{display:flex;justify-content:space-between;gap:15px;align-items:start}.order-id{color:var(--gold);font-weight:700}.muted{color:var(--dim);font-size:12px;line-height:1.6}.items{margin:14px 0;padding:12px;background:#160d0a}.item{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:7px 0}.item:last-child{border-bottom:0}.pill{display:inline-block;border:1px solid var(--line);padding:5px 8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase}.hidden{display:none}.notice{padding:12px;border:1px solid var(--gold);margin-bottom:18px;color:var(--dim)}@media(max-width:700px){.stats{grid-template-columns:1fr}.order-head{display:block}}
</style></head><body><header><div class="brand">WESTERN <span>Avenue</span> / ADMIN</div><div><a href="index (1).html" style="color:var(--bone);margin-right:12px">Store</a><button class="secondary" onclick="logout()">Sign out</button></div></header>
<main class="wrap"><div id="loginView" class="card login"><div class="kicker">Private portal</div><h1>Admin login.</h1><p class="muted">Use the Supabase Auth account you created for your store administrator.</p><div id="loginError" class="notice hidden"></div><form onsubmit="adminLogin(event)"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button type="submit">Sign in →</button></form></div>
<div id="adminView" class="hidden"><div class="kicker">Store control room</div><h1 class="title">Orders.</h1><div id="notice" class="notice hidden"></div><div class="stats"><div class="stat"><span class="muted">Total orders</span><strong id="totalOrders">0</strong></div><div class="stat"><span class="muted">New orders</span><strong id="newOrders">0</strong></div><div class="stat"><span class="muted">Revenue</span><strong id="revenue">Rs. 0</strong></div></div><div class="card"><div class="bar"><h2>Customer orders</h2><button onclick="loadOrders()">Refresh</button></div><div id="orders" class="orders"></div></div></div></main>
<script>
const SUPABASE_URL='YOUR_SUPABASE_URL';const SUPABASE_ANON_KEY='YOUR_SUPABASE_ANON_KEY';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const money=n=>'Rs. '+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
async function adminLogin(e){e.preventDefault();const {error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){loginError.textContent=error.message;loginError.classList.remove('hidden');return}loginError.classList.add('hidden');showAdmin()}
async function showAdmin(){const {data:{session}}=await db.auth.getSession();if(!session){loginView.classList.remove('hidden');adminView.classList.add('hidden');return}loginView.classList.add('hidden');adminView.classList.remove('hidden');loadOrders()}
async function logout(){await db.auth.signOut();showAdmin()}
async function loadOrders(){const box=document.getElementById('orders');box.innerHTML='<div class="muted">Loading orders…</div>';const {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false});if(error){box.innerHTML='<div class="notice">'+error.message+'</div>';return}document.getElementById('totalOrders').textContent=data.length;document.getElementById('newOrders').textContent=data.filter(x=>x.status==='new').length;document.getElementById('revenue').textContent=money(data.reduce((n,x)=>n+Number(x.total||0),0));if(!data.length){box.innerHTML='<div class="muted">No customer orders yet.</div>';return}box.innerHTML=data.map(o=>`<article class="order"><div class="order-head"><div><div class="order-id">ORDER #${o.id}</div><strong>${esc(o.customer_name)}</strong><div class="muted">${new Date(o.created_at).toLocaleString()} · ${esc(o.phone)}</div></div><div><span class="pill">${esc(o.status)}</span><select onchange="updateStatus(${o.id},this.value)" style="margin-left:8px"><option ${o.status==='new'?'selected':''}>new</option><option ${o.status==='processing'?'selected':''}>processing</option><option ${o.status==='shipped'?'selected':''}>shipped</option><option ${o.status==='delivered'?'selected':''}>delivered</option><option ${o.status==='cancelled'?'selected':''}>cancelled</option></select></div></div><div class="items">${(o.items||[]).map(i=>`<div class="item"><span>${esc(i.name)} × ${i.qty}</span><strong>${money(Number(i.price)*Number(i.qty))}</strong></div>`).join('')}</div><div class="muted"><strong>Ship to:</strong> ${esc(o.address)}, ${esc(o.city)} - ${esc(o.pin_code)}<br><strong>Total:</strong> ${money(o.total)} · Payment: ${esc(o.payment_method)}</div></article>`).join('')}
async function updateStatus(id,status){const {error}=await db.from('orders').update({status}).eq('id',id);if(error){alert(error.message)}else{loadOrders()}}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
showAdmin();
</script></body></html>
